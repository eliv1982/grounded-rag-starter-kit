<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}RAG-ассистент{% endblock %}</title>
  <style>
    :root {
      --bg: #FAF7F2;
      --card: #FFFFFF;
      --text: #1F2933;
      --muted: #6B6258;
      --border: #E7DCCB;
      --primary: #92400E;
      --primary-hover: #A16207;
      --accent-soft: #F3E8D0;
      --error-bg: #FFF4F1;
      --error-border: #EFC9BD;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.55;
    }
    .container {
      max-width: 960px;
      margin: 2.5rem auto;
      padding: 0 1rem;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.15rem 1.25rem;
      box-shadow: 0 4px 14px rgba(45, 35, 20, 0.06);
      margin-top: 1rem;
    }
    h1, h2, h3 { margin: 0 0 0.6rem; }
    p { margin: 0.35rem 0 0.9rem; color: var(--muted); }
    label {
      display: inline-block;
      margin-bottom: 0.35rem;
      font-weight: 600;
      color: var(--text);
    }
    textarea {
      width: 100%;
      min-height: 150px;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.75rem 0.85rem;
      resize: vertical;
      font: inherit;
      color: var(--text);
      background: #fff;
    }
    textarea:focus {
      outline: none;
      border-color: #d2b48c;
      box-shadow: 0 0 0 3px rgba(146, 64, 14, 0.14);
    }
    button {
      margin-top: 0.8rem;
      padding: 0.62rem 1rem;
      border: none;
      border-radius: 10px;
      color: #fff;
      background: var(--primary);
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.15s ease-in-out;
    }
    button:hover { background: var(--primary-hover); }
    .hero-subtitle { margin-bottom: 0.75rem; }
    .badge-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      margin-top: 0.35rem;
    }
    .badge {
      display: inline-block;
      padding: 0.22rem 0.58rem;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--accent-soft);
      color: #6f3c0f;
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.01em;
    }
    .error-card {
      background: var(--error-bg);
      border-color: var(--error-border);
      color: #7a2323;
    }
    .answer-text {
      color: var(--text);
      white-space: pre-wrap;
      margin-top: 0.25rem;
    }
    .answer-meta {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-bottom: 0.35rem;
    }
    .answer-badge {
      display: inline-block;
      padding: 0.18rem 0.55rem;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--accent-soft);
      color: #6f3c0f;
      font-size: 0.8rem;
      font-weight: 600;
    }
    .answer-subtle {
      font-size: 0.88rem;
      color: var(--muted);
    }
    .sources-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 0.75rem;
      margin-top: 0.6rem;
    }
    .source-card {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.7rem 0.8rem;
      background: #FFFCF8;
    }
    .source-title {
      font-weight: 700;
      margin-bottom: 0.25rem;
      color: #7a3f12;
    }
    .source-meta {
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 0.25rem;
    }
    .source-snippet {
      font-size: 0.92rem;
      color: #374151;
      max-height: 7.2em;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
